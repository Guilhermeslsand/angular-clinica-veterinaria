<mat-toolbar>
  <span>Clinica Veterinária</span>
  <span class="spacer"></span>

  <button mat-raised-button color="primary" (click)="novaConsulta()">
    <mat-icon>add</mat-icon>
    Nova Consulta
  </button>
</mat-toolbar>

<main class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title> Consultas </mat-card-title>

      <mat-card-subtitle> Consultas cadastradas na clínica </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (loading) {
        <div class="loading">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      } @else if (consultas.length === 0) {
        <div class="empty">
          <mat-icon>event_busy</mat-icon>
          <p>Nenhuma consulta cadastrada.</p>

          <button mat-raised-button color="primary" (click)="novaConsulta()">
            Cadastrar consulta
          </button>
        </div>
      } @else {
        <table mat-table [dataSource]="consultas" class="consultas-table">
          <!-- Animal -->
          <ng-container matColumnDef="animal">
            <th mat-header-cell *matHeaderCellDef>Animal</th>

            <td mat-cell *matCellDef="let consulta">
              {{ consulta.animal.nome }}
            </td>
          </ng-container>

          <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef>Data da consulta</th>
            <td mat-cell *matCellDef="let consulta">
              {{ formatarData(consulta.data_consulta) }}
            </td>
          </ng-container>

          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let consulta">
              <button mat-icon-button matTooltip="Visualizar" (click)="visualizar(consulta.id)">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button matTooltip="Editar" (click)="editar(consulta.id)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button matTooltip="Excluir" (click)="excluir(consulta)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      }
    </mat-card-content>
  </mat-card>
</main>
